# Copy this file to `.github/workflows/e2e.yml` at the root of the repository
# that contains this app. GitHub only discovers workflows under the repo root.
name: e2e

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tauri-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent-e2e-poc

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-e2e-poc/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent-e2e-poc/src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            xvfb

      - name: Install npm dependencies
        run: npm ci

      - name: Run agent harness
        run: node agent/run.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: agent-e2e-poc/artifacts
          if-no-files-found: warn
