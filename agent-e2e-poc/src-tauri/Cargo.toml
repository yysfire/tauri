[package]
name = "agent-e2e-poc"
version = "0.1.0"
description = "Minimal Tauri app that an AI agent can drive and verify end to end"
edition = "2021"
rust-version = "1.77.2"

# Standalone package: keep it out of the parent Tauri repository workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"

# Automation surface. Registration is gated by the `wdio` feature so a normal
# release build never starts the in-app WebDriver server or the mock bridge.
# The crates stay linked so capability files resolve in every build mode.
tauri-plugin-wdio = "1"
tauri-plugin-wdio-webdriver = "1"

[features]
wdio = []
