[package]
name = "agent-e2e-poc"
version = "0.1.0"
description = "Minimal Tauri app that an AI agent can drive and verify end to end"
edition = "2021"
rust-version = "1.77.2"

# Standalone package: keep it out of the parent Tauri repository workspace.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }

# Automation surface. Optional and only enabled by the `wdio` feature so a
# normal release build cannot expose the in-app WebDriver server.
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[features]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
